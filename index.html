<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>meeEL Page</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a84ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="meeEL" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true">
        <rect width="64" height="64" rx="14" ry="14" fill="#0a84ff"/>
        <path d="M18 48 L18 28 Q18 22 25 22 Q32 22 32 28 L32 48 M32 28 Q32 22 39 22 Q46 22 46 28 L46 48"
              fill="none" stroke="#ffffff" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>meeEL Page</span>
    </div>
    <div class="topbar-right">
      <span id="save-indicator" class="save-indicator"></span>
      <button id="install-btn" class="btn-install" title="Install meeEL Page" aria-label="Install" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Install</span>
      </button>
      <button id="tools-btn" class="btn-tools" title="Tools" aria-label="Tools">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </button>
      <button id="import-btn" class="btn-import" title="Import .meeel file" aria-label="Import">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </button>
      <button id="publish-btn" class="btn-publish" title="Publish" aria-label="Publish">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <input type="file" id="import-input" accept=".meeel,.me,.txt" hidden>
    </div>
  </header>

  <main class="layout">
    <section class="pane editor-pane">
      <div class="pane-header">Write</div>
      <div class="editor-container">
        <div class="gutter" id="gutter"></div>
        <div class="editor-wrap">
          <pre class="editor-highlight" aria-hidden="true"><code id="highlight-output"></code></pre>
          <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
        </div>
      </div>
      <div class="suggestion-bar" id="suggestion-bar" hidden></div>
    </section>
    <section class="pane preview-pane">
      <div class="pane-header">
        <span>See it</span>
        <div class="preview-controls">
          <select id="page-selector" class="page-selector" hidden></select>
          <button id="preview-fullscreen" class="btn-icon" title="Full screen" aria-label="Full screen">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
              <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
          </button>
        </div>
      </div>
      <iframe id="preview"></iframe>
    </section>
  </main>

  <!-- Publish Modal -->
  <div class="modal-backdrop" id="publish-modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <div class="modal-header-left">
          <div class="modal-brand">
            <span>meeEL<span class="modal-brand-accent">.</span></span>
          </div>
          <div class="modal-subtitle">Download and Publish</div>
        </div>
        <button class="modal-close" id="publish-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="meeel">meeEL</button>
        <button class="modal-tab" data-tab="html">HTML</button>
        <button class="modal-tab" data-tab="css">CSS</button>
        <button class="modal-tab" data-tab="js">JS</button>
        <button class="modal-tab" data-tab="python">PYTHON</button>
        <button class="modal-tab" data-tab="readme">README</button>
      </div>

      <div class="modal-body">
        <div class="code-wrap">
          <button class="copy-btn" id="copy-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>Copy</span>
          </button>
          <pre id="modal-code"><code></code></pre>
        </div>
      </div>

      <div class="modal-footer">
        <span class="modal-footer-hint">Made by mee Innovations</span>
        <button class="btn-secondary" id="download-file">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span id="download-file-label">Download HTML</span>
        </button>
        <button class="btn-primary" id="download-all">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Download as ZIP</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Tools Drawer -->
  <div id="tools-drawer" class="tools-drawer">
    <div class="tools-header">
      <span class="tools-title">Tools</span>
      <button id="tools-close" class="tools-close" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <button id="learn-btn" class="learn-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      <span>Learn to write</span>
    </button>

    <div class="tools-section">
      <div class="tools-label">Color picker</div>
      <div class="tools-hint">Tap any color to copy its code.</div>

      <div id="color-bar" class="color-bar" tabindex="0" role="slider" aria-label="Color picker">
        <div id="color-marker" class="color-marker"></div>
      </div>

      <div class="color-info">
        <div id="color-preview" class="color-preview"></div>
        <div class="color-text">
          <div id="color-hex" class="color-hex">#3DF5B0</div>
          <div id="color-name" class="color-name">Green</div>
        </div>
        <button id="color-copy" class="color-copy" type="button">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span>Copy</span>
        </button>
      </div>
    </div>

    <div class="tools-section">
      <div class="tools-label">Font picker</div>
      <div class="tools-hint">Tap a font name to copy it.</div>
      <div id="font-list" class="font-list"></div>
    </div>
  </div>

  <div id="tools-backdrop" class="tools-backdrop" hidden></div>

  <!-- Learn Book Modal -->
  <div id="book-modal" class="book-modal" hidden>
    <div class="book-header">
      <div class="book-header-left">
        <span class="book-title">Learn to write meeEL</span>
        <span class="book-subtitle">A small guide, chapter by chapter</span>
      </div>
      <button id="book-close" class="book-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="book-body">
      <aside class="book-sidebar">
        <div id="book-chapters" class="book-chapters"></div>
      </aside>

      <main id="book-content" class="book-content">
        <article id="book-article"></article>
      </main>
    </div>
  </div>

  <script type="module" src="/src/ui/app.ts"></script>
</body>
</html>
